[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plainsight"
description = "A reader for the skills used by Claude AI"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "PySide6>=6.7",
    "markdown>=3.5",
]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["plainsight*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
addopts = [
    "--cov=plainsight.domain",
    "--cov=plainsight.application",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
testpaths = ["tests"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "if TYPE_CHECKING:",
]

[tool.ruff]
extend-exclude = [
    "venv",
    ".venv",
    "build",
    "dist",
    "dist-pyinstaller",
    "dist-installer",
    "dist-installer.build",
    "installer/payload",
    "packaging",
]
